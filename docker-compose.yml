version: '3.8'

services:
  # 1. Unified Relational + Vector Database (PostgreSQL 16)
  db:
    image: pgvector/pgvector:pg16
    container_name: mp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marchespublics}
      POSTGRES_USER: ${POSTGRES_USER:-hamza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rootpassword}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: >
      postgres 
      -c shared_buffers=256MB 
      -c work_mem=16MB 
      -c maintenance_work_mem=64MB 
      -c timezone=Africa/Casablanca
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hamza} -d ${POSTGRES_DB:-marchespublics}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Ingestion & Email Alert Worker Daemon
  ingestion-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mp_worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - app_data:/app/data
      - app_logs:/app/logs
    command: ["python", "-m", "src.scheduler.jobs"]

  # 3. Interactive Web Dashboard & API
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mp_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  pgdata:
    driver: local
  app_data:
    driver: local
  app_logs:
    driver: local
